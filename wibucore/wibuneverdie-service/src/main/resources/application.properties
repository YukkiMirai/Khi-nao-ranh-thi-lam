spring.application.name=wibuneverdie-service
server.port=8090

# Thong tin ket noi Database
spring.datasource.url=jdbc:postgresql://192.168.1.107:5432/wibuneverdie_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Cau hinh Hibernate / JPA
# Thay 'validate' bang 'update' de Hibernate tu dong tao bang neu thieu
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Bo dong hibernate.dialect vi Spring Boot 3 tu nhan dien duoc Postgres 15
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cho phep in log cac tham so truyen vao SQL (de debug)
logging.level.org.hibernate.orm.jdbc.bind=trace

# =============================================
# JWT Configuration
# IMPORTANT: Thay secret bang gia tri random 256-bit trong production!
# Generate: openssl rand -base64 32
# =============================================
jwt.secret=d2lidW5ldmVyZGllLXNlY3JldC1rZXktbXVzdC1iZS1jaGFuZ2VkLWluLXByb2R1Y3Rpb24=
# Thoi gian hieu luc token: 24 gio (milliseconds)
jwt.expiration=86400000